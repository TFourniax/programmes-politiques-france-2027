version: 3
enabled: true

official_discovery:
  max_sitemaps_per_site: 8
  max_relevant_urls_per_site: 80
  max_feeds_per_site: 2

gdelt:
  enabled: true
  timespan: 1d
  max_entities: 60
  batch_size: 6
  max_records_per_batch: 75
  keep_per_entity: 3
  request_delay_seconds: 1.5
  max_retries: 3
  retry_backoff_seconds: 4
  allow_unlisted_domains: false
  trusted_press_domains:
    - afp.com
    - bfmtv.com
    - europe1.fr
    - france24.com
    - franceinfo.fr
    - franceinter.fr
    - la-croix.com
    - ladepeche.fr
    - latribune.fr
    - lefigaro.fr
    - lemonde.fr
    - leparisien.fr
    - lesechos.fr
    - liberation.fr
    - lcp.fr
    - mediapart.fr
    - nicematin.com
    - nouvelobs.com
    - ouest-france.fr
    - publicsenat.fr
    - radiofrance.fr
    - reuters.com
    - rtl.fr
    - sudouest.fr
    - tf1info.fr
    - 20minutes.fr

google_search_grounding:
  # Désactivé pour préserver le coût zéro sur le projet Gemini actuel.
  enabled: false
  model: gemini-3.5-flash-lite
  max_entities: 60
  max_urls_per_entity: 5
  request_delay_seconds: 0.10

# Promotion automatique vers le corpus canonique, sans file de review humaine.
# Seules les preuves tier_1 passent ce gate. Deux passes Gemini distinctes sont
# combinées à des contrôles déterministes (propriétaire, domaine, citation exacte,
# attribution candidat/parti, contradiction/versioning). Une ambiguïté n'est pas
# arbitrée : elle reste hors corpus jusqu'à une future preuve plus forte.
auto_promotion:
  enabled: true
  model: gemini-3.5-flash-lite
  max_sources_per_run: 8
  max_source_chars: 60000
  max_claims_per_source: 10
  request_delay_seconds: 0.25

bluesky:
  enabled: true
  max_posts_per_profile: 20

youtube:
  enabled: true
  max_videos_per_channel: 12

x:
  enabled: false
  mode: discover_only
  note: "Activer la lecture X uniquement après définition d'un budget lecture explicite."
