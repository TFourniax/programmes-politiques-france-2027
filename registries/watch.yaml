version: 11
enabled: true

official_discovery:
  max_sitemaps_per_site: 8
  max_relevant_urls_per_site: 80
  max_feeds_per_site: 2

# Certains sites officiels protègent leur HTML contre les robots mais publient un
# flux structuré officiel accessible. Ces flux servent uniquement à découvrir de
# nouvelles URLs : un titre RSS ne suffit jamais à promouvoir une proposition.
official_direct_feeds:
  - id: pcf-actualites
    owner: Parti communiste français
    url: https://pcf.nationbuilder.com/actualites.rss
    public_origin: https://www.pcf.fr/
    source_tier: tier_1_primary_official
  - id: lfi-parti
    owner: La France insoumise
    url: https://lafranceinsoumise.fr/feed/
    public_origin: https://lafranceinsoumise.fr/
    source_tier: tier_1_primary_official

# Source primaire complète LFI : les 18 chapitres publics de l'édition 2025 et toutes
# leurs sections sont récupérés directement depuis melenchon2027.fr. Le nombre 18 est
# un plancher, pas un plafond : les chapitres suivants sont sondés automatiquement.
# Une seule section manquante rend la représentation incomplète ; aucun RSS ni titre
# de recherche n'est accepté comme preuve canonique à la place du contenu primaire.
official_structured_sources:
  - id: lfi-programme-chapters
    owner: La France insoumise
    kind: html_programme_chapters
    public_base: https://melenchon2027.fr/programme2025/livre
    minimum_expected_chapters: 18
    max_probe_chapters: 30
    stop_after_consecutive_missing: 3
    min_content_chars: 500
    min_section_chars: 180
    request_delay_seconds: 0.05
    coverage_urls:
      - https://programme.lafranceinsoumise.fr/
      - https://melenchon2027.fr/programme2025/livre/
    source_tier: tier_1_primary_official

gdelt:
  enabled: true
  timespan: 1d
  max_entities: 60
  batch_size: 9
  max_records_per_batch: 75
  keep_per_entity: 3
  request_timeout_seconds: 15
  request_delay_seconds: 3.0
  max_retries: 1
  retry_backoff_seconds: 8
  allow_unlisted_domains: false
  trusted_press_domains:
    - afp.com
    - bfmtv.com
    - europe1.fr
    - france24.com
    - franceinfo.fr
    - franceinter.fr
    - la-croix.com
    - ladepeche.fr
    - latribune.fr
    - lefigaro.fr
    - lemonde.fr
    - leparisien.fr
    - lesechos.fr
    - liberation.fr
    - lcp.fr
    - mediapart.fr
    - nicematin.com
    - nouvelobs.com
    - ouest-france.fr
    - publicsenat.fr
    - radiofrance.fr
    - reuters.com
    - rtl.fr
    - sudouest.fr
    - tf1info.fr
    - 20minutes.fr

google_search_grounding:
  # Désactivé pour préserver le coût zéro sur le projet Gemini actuel.
  enabled: false
  model: gemini-3.5-flash-lite
  max_entities: 60
  max_urls_per_entity: 5
  request_delay_seconds: 0.10

# Promotion automatique web/PDF/captures primaires : le document complet est drainé
# par chunks persistants. Une source n'est finalisée qu'une fois tous les chunks traités.
auto_promotion:
  enabled: true
  model: gemini-3.5-flash-lite
  max_sources_per_run: 3
  max_source_chars: 4000000
  chunk_chars: 18000
  chunk_overlap_chars: 700
  max_chunks_per_source_per_run: 2
  max_claims_per_chunk: 8
  request_delay_seconds: 0.5

# Les publications sociales passent d'abord un contrôle d'identité indépendant.
# Seules les publications d'un profil effectivement vérifié arrivent ici.
# Pour une publication sociale, aucune proposition de parti n'est transférée à un
# candidat (ou inversement) : seule l'entité propriétaire du profil est autorisée.
social_auto_promotion:
  enabled: true
  model: gemini-3.5-flash-lite
  max_posts_per_run: 4
  max_source_chars: 4000
  max_claims_per_chunk: 5
  request_delay_seconds: 0.75

bluesky:
  enabled: true
  max_posts_per_profile: 20

youtube:
  enabled: true
  max_videos_per_channel: 12

x:
  enabled: false
  mode: discover_only
  note: "Les liens X sont découverts mais restent non vérifiés tant qu'aucun contrôle d'identité gratuit fiable n'est disponible."
