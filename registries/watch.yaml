version: 2
enabled: true

# La veille produit des pistes dans research/veille/. Elle ne modifie jamais
# automatiquement le corpus canonique ni les propositions.
official_discovery:
  max_sitemaps_per_site: 8
  max_relevant_urls_per_site: 80
  max_feeds_per_site: 2

gdelt:
  enabled: true
  timespan: 1d
  max_entities: 60
  batch_size: 6
  max_records_per_batch: 75
  keep_per_entity: 3
  request_delay_seconds: 1.5
  max_retries: 3
  retry_backoff_seconds: 4
  # Par défaut, GDELT sert de radar sur une liste de médias reconnus. Une URL
  # hors liste n'est pas promue automatiquement dans la boîte de réception.
  allow_unlisted_domains: false
  trusted_press_domains:
    - afp.com
    - bfmtv.com
    - europe1.fr
    - france24.com
    - franceinfo.fr
    - franceinter.fr
    - la-croix.com
    - ladepeche.fr
    - latribune.fr
    - lefigaro.fr
    - lemonde.fr
    - leparisien.fr
    - lesechos.fr
    - liberation.fr
    - lcp.fr
    - mediapart.fr
    - nicematin.com
    - nouvelobs.com
    - ouest-france.fr
    - publicsenat.fr
    - radiofrance.fr
    - reuters.com
    - rtl.fr
    - sudouest.fr
    - tf1info.fr
    - 20minutes.fr

google_search_grounding:
  # Désactivé sur le chemin coût-zéro : les nouveaux projets Gemini 3 nécessitent
  # actuellement un projet avec billing pour utiliser Google Search Grounding.
  # La clé Gemini reste utilisée pour l'inférence gratuite et les futurs contrôles
  # d'extraction/vérification ; la découverte web gratuite repose sur les sites
  # officiels, RSS/sitemaps, GDELT et les réseaux gratuits.
  enabled: false
  model: gemini-3.5-flash-lite
  max_entities: 60
  max_urls_per_entity: 5
  request_delay_seconds: 0.10

# Bluesky est interrogé via l'AppView public, sans compte, token ni clé API.
# Un profil n'est considéré officiel que s'il est lié depuis un site officiel
# déjà suivi par le projet.
bluesky:
  enabled: true
  max_posts_per_profile: 20

# YouTube Data API fonctionne dans son quota gratuit. Les chaînes sont d'abord
# découvertes depuis les sites officiels. La collecte est automatiquement
# ignorée tant que YOUTUBE_API_KEY n'est pas défini.
youtube:
  enabled: true
  max_videos_per_channel: 12

# X est découvert depuis les sites officiels et enregistré dans le snapshot des
# profils, mais aucune timeline X n'est appelée pour conserver un coût nul.
x:
  enabled: false
  mode: discover_only
  note: "Activer la lecture X uniquement après définition d'un budget lecture explicite."
