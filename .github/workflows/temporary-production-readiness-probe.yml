name: Temporary production readiness probe

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-production-readiness-probe.yml'
      - '.github/workflows/daily-watch.yml'
      - 'scripts/daily_watch.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Prove untracked canonical additions are detected
        shell: bash
        run: |
          mkdir -p proposals/auto/__readiness_probe__
          printf '%s\n' '# temporary readiness probe' > proposals/auto/__readiness_probe__/probe.md
          CANONICAL_STATUS="$(git status --porcelain --untracked-files=all -- data/entities.json registries/candidates.yaml corpus/2027 proposals)"
          printf '%s\n' "$CANONICAL_STATUS"
          echo "$CANONICAL_STATUS" | grep -q 'proposals/auto/__readiness_probe__/probe.md'
          rm -rf proposals/auto/__readiness_probe__
          test -z "$(git status --porcelain --untracked-files=all -- data/entities.json registries/candidates.yaml corpus/2027 proposals)"
      - name: Inspect official PCF RSS fallback
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET

          url = 'https://pcf.nationbuilder.com/actualites.rss'
          request = urllib.request.Request(url, headers={
              'User-Agent': 'programmes-politiques-france-2027-watch/1.0 (+https://github.com/TFourniax/programmes-politiques-france-2027)',
              'Accept-Language': 'fr,en;q=0.7',
          })
          with urllib.request.urlopen(request, timeout=20) as response:
              raw = response.read()
              assert response.status == 200
              assert 'rss' in response.headers.get('content-type', '').lower()
          root = ET.fromstring(raw)
          items = []
          for item in root.findall('./channel/item')[:10]:
              title = (item.findtext('title') or '').strip()
              link = (item.findtext('link') or '').strip()
              description = (item.findtext('description') or '').strip()
              encoded = ''
              for child in item:
                  if child.tag.endswith('encoded'):
                      encoded = (child.text or '').strip()
              items.append({
                  'title': title,
                  'link': link,
                  'description_length': len(description),
                  'encoded_length': len(encoded),
                  'description_sample': description[:400],
                  'encoded_sample': encoded[:400],
              })
          assert items, 'PCF RSS feed returned no items'
          print('PCF_RSS_PROBE=' + json.dumps(items, ensure_ascii=False))
          PY
