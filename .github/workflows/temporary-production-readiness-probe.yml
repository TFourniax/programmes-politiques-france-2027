name: Temporary production readiness probe

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-production-readiness-probe.yml'
      - '.github/workflows/daily-watch.yml'
      - 'registries/watch.yaml'
      - 'registries/parties.yaml'
      - 'registries/sources.yaml'
      - 'scripts/daily_watch.py'
      - 'scripts/direct_feed_watch.py'
      - 'scripts/update_source_health.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Prove untracked canonical additions are detected
        shell: bash
        run: |
          mkdir -p proposals/auto/__readiness_probe__
          printf '%s\n' '# temporary readiness probe' > proposals/auto/__readiness_probe__/probe.md
          CANONICAL_STATUS="$(git status --porcelain --untracked-files=all -- data/entities.json registries/candidates.yaml corpus/2027 proposals)"
          printf '%s\n' "$CANONICAL_STATUS"
          echo "$CANONICAL_STATUS" | grep -q 'proposals/auto/__readiness_probe__/probe.md'
          rm -rf proposals/auto/__readiness_probe__
          test -z "$(git status --porcelain --untracked-files=all -- data/entities.json registries/candidates.yaml corpus/2027 proposals)"
      - name: Probe official LFI structured endpoints from the production runner environment
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          urls = [
              'https://programme.lafranceinsoumise.fr/wp-sitemap.xml',
              'https://programme.lafranceinsoumise.fr/sitemap_index.xml',
              'https://programme.lafranceinsoumise.fr/feed/',
              'https://melenchon2027.fr/wp-sitemap.xml',
              'https://melenchon2027.fr/sitemap_index.xml',
              'https://melenchon2027.fr/feed/',
              'https://lafranceinsoumise.fr/wp-sitemap.xml',
              'https://lafranceinsoumise.fr/feed/',
          ]
          headers = {
              'User-Agent': 'programmes-politiques-france-2027-watch/1.0 (+https://github.com/TFourniax/programmes-politiques-france-2027)',
              'Accept-Language': 'fr,en;q=0.7',
          }
          results = []
          for url in urls:
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      raw = response.read(1500)
                      results.append({
                          'url': url,
                          'status': response.status,
                          'resolved': response.geturl(),
                          'content_type': response.headers.get('content-type', ''),
                          'sample': raw[:240].decode('utf-8', errors='replace').replace('\n', ' '),
                      })
              except urllib.error.HTTPError as exc:
                  raw = exc.read(1500)
                  results.append({
                      'url': url,
                      'status': exc.code,
                      'resolved': exc.geturl(),
                      'content_type': exc.headers.get('content-type', ''),
                      'sample': raw[:240].decode('utf-8', errors='replace').replace('\n', ' '),
                  })
              except Exception as exc:
                  results.append({'url': url, 'error': f'{type(exc).__name__}: {exc}'})
          print('LFI_ENDPOINT_PROBE=' + json.dumps(results, ensure_ascii=False))
          assert any(item.get('status') == 200 and any(token in str(item.get('content_type', '')).lower() for token in ('xml', 'rss', 'atom')) for item in results), results
          PY
      - name: Run targeted feed and health tests
        run: pytest -q tests/test_direct_feed_watch.py tests/test_update_source_health.py
