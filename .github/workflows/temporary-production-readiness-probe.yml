name: Temporary production readiness probe

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-production-readiness-probe.yml'
      - 'registries/watch.yaml'
      - 'scripts/direct_feed_watch.py'
      - 'scripts/update_source_health.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Prove untracked canonical additions are detected
        shell: bash
        run: |
          mkdir -p proposals/auto/__readiness_probe__
          printf '%s\n' '# temporary readiness probe' > proposals/auto/__readiness_probe__/probe.md
          CANONICAL_STATUS="$(git status --porcelain --untracked-files=all -- data/entities.json registries/candidates.yaml corpus/2027 proposals)"
          printf '%s\n' "$CANONICAL_STATUS"
          echo "$CANONICAL_STATUS" | grep -q 'proposals/auto/__readiness_probe__/probe.md'
          rm -rf proposals/auto/__readiness_probe__
      - name: Inspect LFI programme sitemap structure
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET

          headers = {
              'User-Agent': 'programmes-politiques-france-2027-watch/1.0 (+https://github.com/TFourniax/programmes-politiques-france-2027)',
              'Accept-Language': 'fr,en;q=0.7',
          }
          index_url = 'https://melenchon2027.fr/sitemap_index.xml'
          with urllib.request.urlopen(urllib.request.Request(index_url, headers=headers), timeout=20) as response:
              raw = response.read()
              assert response.status == 200
          root = ET.fromstring(raw)
          children = [
              (node.text or '').strip()
              for node in root.iter()
              if node.tag.rsplit('}', 1)[-1].lower() == 'loc' and (node.text or '').strip()
          ]
          print('LFI_SITEMAP_CHILDREN=' + json.dumps(children, ensure_ascii=False))
          assert children, 'empty sitemap index'
          coverage = []
          for child_url in children[:12]:
              with urllib.request.urlopen(urllib.request.Request(child_url, headers=headers), timeout=20) as response:
                  child_raw = response.read()
                  assert response.status == 200
              child = ET.fromstring(child_raw)
              urls = []
              for url_node in child:
                  loc = None
                  lastmod = None
                  for field in list(url_node):
                      name = field.tag.rsplit('}', 1)[-1].lower()
                      if name == 'loc': loc = (field.text or '').strip()
                      if name == 'lastmod': lastmod = (field.text or '').strip()
                  if loc and '/programme2025/' in loc:
                      urls.append({'url': loc, 'lastmod': lastmod})
              if urls:
                  coverage.append({'sitemap': child_url, 'programme_urls': urls[:10], 'count': len(urls)})
          print('LFI_PROGRAMME_SITEMAP_COVERAGE=' + json.dumps(coverage, ensure_ascii=False))
          assert coverage, 'no sitemap child covers /programme2025/'
          PY
      - name: Run targeted feed and health tests
        run: pytest -q tests/test_direct_feed_watch.py tests/test_update_source_health.py
