name: Temporary production readiness probe

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-production-readiness-probe.yml'
      - '.github/workflows/daily-watch.yml'
      - 'scripts/daily_watch.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Prove untracked canonical additions are detected
        shell: bash
        run: |
          mkdir -p proposals/auto/__readiness_probe__
          printf '%s\n' '# temporary readiness probe' > proposals/auto/__readiness_probe__/probe.md
          CANONICAL_STATUS="$(git status --porcelain --untracked-files=all -- data/entities.json registries/candidates.yaml corpus/2027 proposals)"
          printf '%s\n' "$CANONICAL_STATUS"
          echo "$CANONICAL_STATUS" | grep -q 'proposals/auto/__readiness_probe__/probe.md'
          rm -rf proposals/auto/__readiness_probe__
          test -z "$(git status --porcelain --untracked-files=all -- data/entities.json registries/candidates.yaml corpus/2027 proposals)"
      - name: Probe blocked official sources from a GitHub runner
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error

          urls = [
              'https://programme.lafranceinsoumise.fr/',
              'https://melenchon2027.fr/programme2025/livre/',
              'https://www.pcf.fr/',
              'https://www.pcf.fr/actualites',
              'https://pcf.nationbuilder.com/',
              'https://pcf.nationbuilder.com/actualites',
              'https://pcf.nationbuilder.com/sitemap.xml',
              'https://assets.nationbuilder.com/pcf/pages/2819/attachments/original/1784790181/base_commune_finale_40e_congres_ppp.pdf',
          ]
          profiles = {
              'watch': {
                  'User-Agent': 'programmes-politiques-france-2027-watch/1.0 (+https://github.com/TFourniax/programmes-politiques-france-2027)',
                  'Accept-Language': 'fr,en;q=0.7',
              },
              'browser': {
                  'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',
                  'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
                  'Accept-Language': 'fr-FR,fr;q=0.9,en;q=0.7',
                  'Cache-Control': 'no-cache',
                  'Pragma': 'no-cache',
              },
          }

          results = []
          for url in urls:
              for profile, headers in profiles.items():
                  req = urllib.request.Request(url, headers=headers)
                  try:
                      with urllib.request.urlopen(req, timeout=20) as response:
                          body = response.read(5000)
                          results.append({
                              'url': url,
                              'profile': profile,
                              'status': response.status,
                              'resolved': response.geturl(),
                              'content_type': response.headers.get('content-type', ''),
                              'sample': body[:180].decode('utf-8', errors='replace').replace('\n', ' '),
                          })
                  except urllib.error.HTTPError as exc:
                      body = exc.read(5000)
                      results.append({
                          'url': url,
                          'profile': profile,
                          'status': exc.code,
                          'resolved': exc.geturl(),
                          'content_type': exc.headers.get('content-type', ''),
                          'sample': body[:180].decode('utf-8', errors='replace').replace('\n', ' '),
                      })
                  except Exception as exc:
                      results.append({'url': url, 'profile': profile, 'error': f'{type(exc).__name__}: {exc}'})
          print('SOURCE_PROBE=' + json.dumps(results, ensure_ascii=False))
          PY
