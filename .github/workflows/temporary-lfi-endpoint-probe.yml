name: Temporary LFI endpoint probe

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-lfi-endpoint-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        lane: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe individual programme pages and discovery endpoints
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.error
          import urllib.request

          base = 'https://melenchon2027.fr'
          headers = {
              'User-Agent': 'programmes-politiques-france-2027-watch/1.0 (+https://github.com/TFourniax/programmes-politiques-france-2027)',
              'Accept-Language': 'fr,en;q=0.7',
          }

          def get(url, limit=2_000_000):
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read(limit)
                      return {
                          'status': response.status,
                          'resolved': response.geturl(),
                          'type': response.headers.get('content-type', ''),
                          'link_header': response.headers.get('link', ''),
                          'body': body,
                      }
              except urllib.error.HTTPError as exc:
                  return {
                      'status': exc.code,
                      'resolved': exc.geturl(),
                      'type': exc.headers.get('content-type', ''),
                      'link_header': exc.headers.get('link', ''),
                      'body': exc.read(4000),
                  }
              except Exception as exc:
                  return {'status': 0, 'error': f'{type(exc).__name__}: {exc}', 'body': b'', 'link_header': ''}

          sitemap_urls = [
              base + '/page-sitemap.xml',
              base + '/post-sitemap.xml',
              base + '/sitemap_index.xml',
              base + '/wp-sitemap.xml',
              base + '/wp-sitemap-posts-post-1.xml',
              base + '/wp-sitemap-posts-page-1.xml',
          ]
          sitemaps = []
          discovered = set()
          for url in sitemap_urls:
              result = get(url)
              text = result['body'].decode('utf-8', errors='replace')
              links = re.findall(r'<loc>([^<]+)</loc>', text, flags=re.I)
              current = sorted({link for link in links if '/programme2025/' in link})
              discovered.update(current)
              sitemaps.append({'url': url, 'status': result['status'], 'bytes': len(result['body']), 'current_programme_urls': len(current)})

          chapters = []
          for number in range(1, 19):
              url = f'{base}/programme2025/livre/chapitre{number}/'
              result = get(url)
              text = result['body'].decode('utf-8', errors='replace')
              visible = re.sub(r'<script.*?</script>|<style.*?</style>|<[^>]+>', ' ', text, flags=re.I | re.S)
              visible = re.sub(r'\s+', ' ', visible).strip()
              section_links = sorted(set(re.findall(r'href=["\']([^"\']+/s\d+/?)["\']', text, flags=re.I)))
              rest_links = re.findall(r'https?://[^>;\s]+/wp-json/wp/v2/[^>;\s]+', result.get('link_header', ''))
              chapters.append({
                  'number': number,
                  'url': url,
                  'status': result['status'],
                  'bytes': len(result['body']),
                  'visible_chars': len(visible),
                  'section_links': len(section_links),
                  'sample_sections': section_links[:4],
                  'rest_links': rest_links[:3],
              })

          sample_sections = []
          for url in [
              base + '/programme2025/livre/chapitre1/s1/',
              base + '/programme2025/livre/chapitre12/s1/',
              base + '/programme2025/livre/chapitre18/s1/',
          ]:
              result = get(url)
              text = result['body'].decode('utf-8', errors='replace')
              visible = re.sub(r'<script.*?</script>|<style.*?</style>|<[^>]+>', ' ', text, flags=re.I | re.S)
              visible = re.sub(r'\s+', ' ', visible).strip()
              sample_sections.append({'url': url, 'status': result['status'], 'bytes': len(result['body']), 'visible_chars': len(visible), 'link_header': result.get('link_header', '')[:500]})

          print('LFI_DIRECT_PROBE=' + json.dumps({
              'lane': '${{ matrix.lane }}',
              'sitemaps': sitemaps,
              'discoveredProgrammeUrls': len(discovered),
              'discoveredSamples': sorted(discovered)[:20],
              'chapters': chapters,
              'sampleSections': sample_sections,
          }, ensure_ascii=False))
          PY
