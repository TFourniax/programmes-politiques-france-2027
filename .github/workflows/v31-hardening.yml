name: V3.1 hardening gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v31-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - name: Data and Python suite
        run: |
          python scripts/validate.py
          pytest -q
      - name: Retrieval quality gate
        run: npm run test:retrieval
      - name: Build
        env:
          LLM_API_KEY: build-only-placeholder
        run: npm run build
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: UX polish
        env:
          CI: 'true'
        run: npx playwright test -c playwright.v31.config.mjs --project=chromium --project=mobile-chromium tests/e2e/ux-polish.spec.js
      - name: Public SEO and open data
        env:
          CI: 'true'
        run: npx playwright test -c playwright.v31.config.mjs --project=chromium --project=mobile-chromium tests/e2e/public-seo.spec.js
      - name: Accessibility baseline
        env:
          CI: 'true'
        run: npx playwright test -c playwright.v31.config.mjs --project=chromium --project=mobile-chromium tests/e2e/accessibility-baseline.spec.js
      - name: Cross-browser smoke
        env:
          CI: 'true'
        run: npx playwright test -c playwright.v31.config.mjs --project=firefox-smoke --project=webkit-smoke --project=mobile-webkit-smoke tests/e2e/cross-browser-smoke.spec.js
