name: Generate release lockfile

on:
  push:
    branches: [release/v1-production-ready]
    paths:
      - '.github/workflows/generate-lockfile-release.yml'
      - 'package.json'

permissions:
  contents: write

jobs:
  lockfile:
    if: github.repository == 'TFourniax/programmes-politiques-france-2027'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v1-production-ready
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Generate deterministic npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'package-lock.json already up to date'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: verrouille les dépendances npm de la V1'
          git push origin HEAD:release/v1-production-ready
