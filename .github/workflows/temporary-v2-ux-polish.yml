name: Temporary V2 final polish

on:
  push:
    branches:
      - experiment/deterministic-rag-v2
    paths:
      - '.github/workflows/temporary-v2-ux-polish.yml'
      - 'scripts/temporary_v2_ux_polish.py'
      - 'scripts/temporary_v2_youtube_public.py'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: experiment/deterministic-rag-v2
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Apply zero-cost YouTube watch hardening
        run: python scripts/temporary_v2_youtube_public.py
      - name: Normalize generated XML fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('tests/test_social_watch.py', 'tests/test_verify_social.py'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('content=b"""<?xml', 'content="""<?xml')
              text = text.replace('</feed>""")', '</feed>""".encode("utf-8"))')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Validate social watch unit contracts
        run: pytest -q tests/test_social_watch.py tests/test_verify_social.py
      - name: Prove real public YouTube feed works without API key
        env:
          YOUTUBE_API_KEY: ''
        run: |
          python - <<'PY'
          import requests
          import sys
          sys.path.insert(0, 'scripts')
          from social_watch import youtube_public_items
          profile = {
              'identifier_type': 'channel_id',
              'identifier': 'UCKHKSD-yanY2ZwwU_4Tgf0w',
              'profile_url': 'https://www.youtube.com/channel/UCKHKSD-yanY2ZwwU_4Tgf0w',
              'entity_name': 'La France insoumise',
          }
          session = requests.Session()
          session.headers.update({'User-Agent': 'programmes-politiques-france-2027-watch/2.0'})
          items, resolved = youtube_public_items(session, profile, 3)
          assert resolved['channel_id'] == profile['identifier'], resolved
          assert resolved['youtube_transport'] == 'public_atom_feed', resolved
          assert resolved.get('display_name'), resolved
          assert items, 'YouTube public feed returned no items'
          assert all(item.get('url') and item.get('title') and item.get('published_at') for item in items), items
          print('YOUTUBE_PUBLIC_FEED_OK', {'channel': resolved['display_name'], 'items': len(items)})
          PY
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Apply UX polish
        run: python scripts/temporary_v2_ux_polish.py
      - name: Install Node dependencies
        run: npm ci
      - name: Retrieval regression suite
        run: npm run test:retrieval
      - name: Production build
        env:
          LLM_API_KEY: build-only-placeholder
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Full browser acceptance
        env:
          CI: 'true'
        run: npm run test:e2e
      - name: Commit only after every V2 gate passes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            components/ChatApp.js \
            components/ExplorerShared.js \
            tests/e2e/ux-polish.spec.js \
            scripts/social_watch.py \
            scripts/verify_social.py \
            tests/test_social_watch.py \
            tests/test_verify_social.py
          if git diff --cached --quiet; then
            echo "No final polish changes to commit."
            exit 0
          fi
          git commit -m "Finalize V2 UX and zero-cost YouTube watch"
          git push origin HEAD:experiment/deterministic-rag-v2
