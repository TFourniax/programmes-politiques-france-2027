name: Temporary V2 UX polish

on:
  push:
    branches:
      - experiment/deterministic-rag-v2
    paths:
      - '.github/workflows/temporary-v2-ux-polish.yml'
      - 'scripts/temporary_v2_ux_polish.py'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: experiment/deterministic-rag-v2
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Apply UX polish
        run: python scripts/temporary_v2_ux_polish.py
      - name: Install dependencies
        run: npm ci
      - name: Retrieval regression suite
        run: npm run test:retrieval
      - name: Production build
        env:
          LLM_API_KEY: build-only-placeholder
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Full browser acceptance
        env:
          CI: 'true'
        run: npm run test:e2e
      - name: Commit only after all gates pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/ChatApp.js components/ExplorerShared.js tests/e2e/ux-polish.spec.js
          if git diff --cached --quiet; then
            echo "No polish changes to commit."
            exit 0
          fi
          git commit -m "Polish V2 UX et navigation utilisateur"
          git push origin HEAD:experiment/deterministic-rag-v2
