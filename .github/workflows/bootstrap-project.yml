name: Bootstrap full project

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  bootstrap:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[BOOTSTRAP2] Import full project'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and verify project archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/project.zip.b64.part* > /tmp/project.zip.b64
          base64 --decode /tmp/project.zip.b64 > /tmp/project.zip
          echo "a0293ad80482ac7ab05d5eec7750c6ec3f47196c754c696d144c0f026867bfae  /tmp/project.zip" | sha256sum -c -
          unzip -tq /tmp/project.zip
          mkdir -p /tmp/project
          unzip -q /tmp/project.zip -d /tmp/project

      - name: Replace bootstrap tree with full project
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='bootstrap/' \
            "/tmp/project/programmes-politiques-france-2027/" ./

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Finalize and validate corpus
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python bootstrap/postprocess.py
          python scripts/build_catalog.py
          python scripts/build_search_index.py
          python scripts/validate.py
          pytest -q
          python bootstrap/postprocess.py --manifest-only

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap .pytest_cache
          find . -type d -name __pycache__ -prune -exec rm -rf {} + || true
          find . -type f -name '*.pyc' -delete || true
          rm -f .github/workflows/bootstrap-project.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initialize full corpus and chatbot interface"
          git push origin HEAD:main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate web application after import
        shell: bash
        env:
          LLM_API_KEY: build-only-placeholder
        run: |
          set -euo pipefail
          npm install
          npm run build
