name: Temporary structured promotion E2E
# Readiness probe: run against the current dual REST transport implementation.

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-structured-promotion-e2e.yml'
      - 'registries/watch.yaml'
      - 'scripts/structured_primary_watch.py'
      - 'scripts/auto_promote.py'
      - 'scripts/auto_promote_runner.py'
      - 'scripts/validate.py'
      - 'package.json'
      - 'lib/**'
      - 'app/**'
      - 'components/**'
      - 'tests/e2e/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promote-real-primary:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Collect current official structured programme
        run: python scripts/structured_primary_watch.py
      - name: Isolate one real official chapter in a fresh promotion backlog
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          import yaml

          base = Path('research/veille')
          state_path = base / 'state.json'
          state = json.loads(state_path.read_text(encoding='utf-8'))
          structured = (state.get('structured_primary_health') or {}).get('lfi-programme-chapters') or {}
          assert structured.get('complete') is True, structured
          assert int(structured.get('item_count') or 0) >= 18, structured
          items = list((structured.get('items') or {}).values())
          selected = next((item for item in items if int(item.get('number') or 0) == 3), None)
          selected = selected or min(items, key=lambda item: int(item.get('text_chars') or 10**9))
          event = {
              'event_type': 'official_new_url',
              'observed_at': structured.get('checked_at'),
              'owner': structured.get('owner'),
              'priority': 'high',
              'published_at': selected.get('date'),
              'source_tier': 'tier_1_primary_official',
              'title': selected.get('title'),
              'url': selected.get('link'),
              'fetch_url': selected.get('fetch_url'),
              'sha256': selected.get('sha256'),
              'verification_state': 'needs_review',
              'provenance': 'official_wordpress_rest_full_primary_content',
              'structured_source_id': 'lfi-programme-chapters',
              'structured_item_number': selected.get('number'),
          }
          day = dt.datetime.now(dt.timezone.utc).date().isoformat()
          (base / f'{day}.jsonl').write_text(json.dumps(event, ensure_ascii=False, sort_keys=True) + '\n', encoding='utf-8')
          state['official_seen_urls'] = {}
          state['structured_primary_health']['lfi-programme-chapters']['items'] = {str(selected['number']): selected}
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          (base / 'promotion-state.json').write_text(json.dumps({'version': 2, 'sources': {}, 'claims': {}, 'source_chunks': {}}, indent=2) + '\n', encoding='utf-8')

          config_path = Path('registries/watch.yaml')
          config = yaml.safe_load(config_path.read_text(encoding='utf-8'))
          config['auto_promotion']['max_sources_per_run'] = 1
          config['auto_promotion']['max_chunks_per_source_per_run'] = 8
          config_path.write_text(yaml.safe_dump(config, allow_unicode=True, sort_keys=False), encoding='utf-8')
          print('STRUCTURED_PROMOTION_SOURCE=' + json.dumps(event, ensure_ascii=False))
          PY
      - name: Promote the real official chapter through Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY"
          python scripts/auto_promote_runner.py
      - name: Prove canonical files were really created and detected as untracked
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          base = Path('research/veille')
          report = json.loads((base / 'promotion-report.json').read_text(encoding='utf-8'))
          assert report.get('processed') == 1, report
          assert report.get('promoted', 0) == 1, report
          assert report.get('proposals_created', 0) >= 1, report
          result = next(item for item in report.get('results', []) if item.get('status') == 'promoted')
          assert result.get('document'), result
          assert result.get('proposals'), result
          assert 'la-france-insoumise' in result['document'], result
          assert Path(result['document']).exists(), result
          assert all(Path(path).exists() for path in result['proposals']), result
          print('REAL_STRUCTURED_PROMOTION=' + json.dumps({
              'document': result['document'],
              'proposals': result['proposals'],
              'verifiedAt': result.get('verified_at'),
          }, ensure_ascii=False))
          PY
          CANONICAL_STATUS="$(git status --porcelain --untracked-files=all -- data/entities.json registries/candidates.yaml corpus/2027 proposals)"
          printf '%s\n' "$CANONICAL_STATUS"
          test -n "$CANONICAL_STATUS"
          echo "$CANONICAL_STATUS" | grep -E '\?\? (corpus/2027|proposals/)'
      - name: Validate generated political canon
        run: |
          python scripts/validate.py
          pytest -q tests/test_auto_promote.py tests/test_auto_promote_runner.py tests/test_structured_primary_watch.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install web dependencies and audit
        run: |
          npm ci
          npm audit --audit-level=high
      - name: Rebuild retrieval on the enriched corpus
        run: npm run test:retrieval
      - name: Build the enriched production application
        env:
          LLM_API_KEY: build-only-placeholder
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise human UI after real auto-enrichment
        env:
          CI: 'true'
        run: npm run test:e2e
