name: Daily political watch

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-watch.yml'
      - 'registries/watch.yaml'

permissions:
  contents: write

concurrency:
  group: daily-political-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run daily watch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/daily_watch.py

      - name: Validate watch code
        run: pytest -q tests/test_daily_watch.py

      - name: Commit watch inbox
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/veille
          if git diff --cached --quiet; then
            echo "No watch output changes to commit."
            exit 0
          fi
          git commit -m "veille: snapshot $(date -u +%F)"
          git push
