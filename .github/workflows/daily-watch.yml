name: Continuous political watch

on:
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-watch.yml'
      - 'registries/watch.yaml'
      - 'registries/sources.yaml'
      - 'registries/parties.yaml'
      - 'registries/candidates.yaml'
      - 'scripts/daily_watch.py'
      - 'scripts/gdelt_watch.py'
      - 'scripts/social_watch.py'
      - 'scripts/verify_social.py'
      - 'scripts/auto_promote.py'
      - 'scripts/auto_promote_runner.py'
      - 'scripts/promote_social.py'
      - 'tests/test_auto_promote.py'
      - 'tests/test_auto_promote_runner.py'
      - 'tests/test_verify_social.py'

permissions:
  contents: write

concurrency:
  group: continuous-political-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Verify Gemini free inference
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          key = os.environ.get("GEMINI_API_KEY", "").strip()
          if not key:
              raise SystemExit("GEMINI_API_KEY is missing from GitHub Actions secrets")
          request = urllib.request.Request(
              "https://generativelanguage.googleapis.com/v1beta/interactions",
              data=json.dumps({
                  "model": "gemini-3.5-flash-lite",
                  "input": "Réponds uniquement par OK.",
                  "store": False,
              }).encode("utf-8"),
              headers={"Content-Type": "application/json", "x-goog-api-key": key},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=45) as response:
                  if response.status != 200:
                      raise SystemExit(f"Gemini preflight failed: HTTP {response.status}")
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              try:
                  detail = json.loads(body).get("error", {}).get("message", "")
              except json.JSONDecodeError:
                  detail = body[:500]
              raise SystemExit(f"Gemini preflight failed: HTTP {exc.code}: {detail}")
          print("Gemini API key and free inference validated successfully.")
          PY

      - name: Collect official web changes
        run: python scripts/daily_watch.py --no-gdelt

      - name: Collect press radar
        run: python scripts/gdelt_watch.py

      - name: Collect official social changes
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/social_watch.py

      - name: Verify social profile identities
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/verify_social.py

      - name: Promote strictly verified official web evidence
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/auto_promote_runner.py

      - name: Promote strictly verified social evidence
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/promote_social.py

      - name: Run Python validation and watch tests
        run: |
          python scripts/validate.py
          pytest -q \
            tests/test_daily_watch.py \
            tests/test_gdelt_watch.py \
            tests/test_social_watch.py \
            tests/test_verify_social.py \
            tests/test_auto_promote.py \
            tests/test_auto_promote_runner.py

      - name: Run retrieval regression tests
        run: npm run test:retrieval

      - name: Build production application
        env:
          LLM_API_KEY: build-only-placeholder
        run: npm run build

      - name: Commit verified watch and canonical updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/veille data/entities.json registries/candidates.yaml corpus/2027 proposals
          if git diff --cached --quiet; then
            echo "No verified changes to commit."
            exit 0
          fi
          git commit -m "veille: mise à jour vérifiée $(date -u +%F)"
          git push
