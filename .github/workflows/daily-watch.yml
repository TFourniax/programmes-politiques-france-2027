name: Continuous political watch

on:
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-watch.yml'
      - 'registries/watch.yaml'
      - 'registries/sources.yaml'
      - 'registries/parties.yaml'
      - 'registries/candidates.yaml'
      - 'scripts/daily_watch.py'
      - 'scripts/direct_feed_watch.py'
      - 'scripts/structured_primary_watch.py'
      - 'scripts/gdelt_watch.py'
      - 'scripts/social_watch.py'
      - 'scripts/prune_social_profiles.py'
      - 'scripts/verify_social.py'
      - 'scripts/auto_promote.py'
      - 'scripts/auto_promote_runner.py'
      - 'scripts/auto_promote_canonical_runner.py'
      - 'scripts/canonical_evidence.py'
      - 'scripts/promote_social.py'
      - 'scripts/repair_promotion_state.py'
      - 'scripts/canonical_queue.py'
      - 'scripts/update_source_health.py'
      - 'scripts/update_watch_health.py'
      - 'scripts/check_watch_health.py'
      - 'tests/test_daily_watch.py'
      - 'tests/test_direct_feed_watch.py'
      - 'tests/test_structured_primary_watch.py'
      - 'tests/test_auto_promote.py'
      - 'tests/test_auto_promote_runner.py'
      - 'tests/test_auto_promote_canonical_runner.py'
      - 'tests/test_canonical_evidence.py'
      - 'tests/test_prune_social_profiles.py'
      - 'tests/test_verify_social.py'
      - 'tests/test_repair_promotion_state.py'
      - 'tests/test_canonical_queue.py'
      - 'tests/test_update_source_health.py'
      - 'tests/test_watch_health.py'

permissions:
  contents: write

concurrency:
  group: continuous-political-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore pending canonical queue
        run: python scripts/canonical_queue.py prepare

      - name: Repair persisted promotion state
        run: python scripts/repair_promotion_state.py

      - name: Probe Gemini without blocking collection
        id: gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          output = os.environ["GITHUB_OUTPUT"]
          key = os.environ.get("GEMINI_API_KEY", "").strip()
          available = False
          detail = "missing key"
          if key:
              request = urllib.request.Request(
                  "https://generativelanguage.googleapis.com/v1beta/interactions",
                  data=json.dumps({
                      "model": "gemini-3.5-flash-lite",
                      "input": "Réponds uniquement par OK.",
                      "store": False,
                  }).encode("utf-8"),
                  headers={"Content-Type": "application/json", "x-goog-api-key": key},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      available = response.status == 200
                      detail = f"HTTP {response.status}"
              except urllib.error.HTTPError as exc:
                  detail = f"HTTP {exc.code}"
              except Exception as exc:
                  detail = f"{type(exc).__name__}: {exc}"
          with open(output, "a", encoding="utf-8") as handle:
              handle.write(f"available={'true' if available else 'false'}\n")
          print(f"Gemini availability: {available} ({detail}). Collection will continue regardless.")
          PY

      - name: Collect official web changes
        run: python scripts/daily_watch.py --no-gdelt

      - name: Collect direct official feeds
        run: python scripts/direct_feed_watch.py

      - name: Collect complete structured primary sources
        run: python scripts/structured_primary_watch.py

      - name: Update official source health
        run: python scripts/update_source_health.py

      - name: Collect press radar
        run: python scripts/gdelt_watch.py

      - name: Collect official social changes
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/social_watch.py

      - name: Expire social profiles no longer confirmed by official sites
        run: python scripts/prune_social_profiles.py --stale-days 7

      - name: Verify social profile identities
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/verify_social.py

      - name: Promote strictly verified official web evidence
        if: steps.gemini.outputs.available == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/auto_promote_canonical_runner.py

      - name: Promote strictly verified social evidence
        if: steps.gemini.outputs.available == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/promote_social.py

      - name: Record autonomous watch health
        env:
          GEMINI_AVAILABLE: ${{ steps.gemini.outputs.available }}
        run: python scripts/update_watch_health.py

      - name: Run Python validation and watch tests
        run: |
          python scripts/validate.py
          pytest -q \
            tests/test_daily_watch.py \
            tests/test_direct_feed_watch.py \
            tests/test_structured_primary_watch.py \
            tests/test_gdelt_watch.py \
            tests/test_social_watch.py \
            tests/test_prune_social_profiles.py \
            tests/test_verify_social.py \
            tests/test_auto_promote.py \
            tests/test_auto_promote_runner.py \
            tests/test_auto_promote_canonical_runner.py \
            tests/test_canonical_evidence.py \
            tests/test_repair_promotion_state.py \
            tests/test_canonical_queue.py \
            tests/test_update_source_health.py \
            tests/test_watch_health.py

      - name: Queue canonical changes and enforce 48h publication window
        id: canonical
        shell: bash
        run: |
          python scripts/canonical_queue.py evaluate \
            --minimum-hours 48 \
            --github-output "$GITHUB_OUTPUT"

      - name: Report pending canonical publication
        if: steps.canonical.outputs.changed == 'true' && steps.canonical.outputs.publish != 'true'
        run: |
          echo "Verified canonical changes are queued without deployment."
          echo "Last canonical publication: ${{ steps.canonical.outputs.last_published_at }}"
          echo "Next eligible publication: ${{ steps.canonical.outputs.next_eligible_at }}"
          echo "Queued files: ${{ steps.canonical.outputs.queued_files }}; deletions: ${{ steps.canonical.outputs.deleted_files }}"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.canonical.outputs.publish == 'true'
        with:
          node-version: '22'
          cache: npm

      - name: Install web dependencies
        if: steps.canonical.outputs.publish == 'true'
        run: npm ci

      - name: Security audit
        if: steps.canonical.outputs.publish == 'true'
        run: npm audit --audit-level=high

      - name: Run retrieval regression tests
        if: steps.canonical.outputs.publish == 'true'
        run: npm run test:retrieval

      - name: Build production application
        if: steps.canonical.outputs.publish == 'true'
        env:
          LLM_API_KEY: build-only-placeholder
        run: npm run build

      - name: Install Playwright Chromium
        if: steps.canonical.outputs.publish == 'true'
        run: npx playwright install --with-deps chromium

      - name: Browser acceptance tests before canonical push
        if: steps.canonical.outputs.publish == 'true'
        env:
          CI: 'true'
        run: npm run test:e2e

      - name: Commit verified watch state or grouped canonical publication
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.canonical.outputs.publish }}" = "true" ]; then
            python scripts/canonical_queue.py finalize
          fi
          git add research/veille data/entities.json registries/candidates.yaml corpus/2027 proposals
          if git diff --cached --quiet; then
            echo "No watch or canonical changes to commit."
            exit 0
          fi
          if [ "${{ steps.canonical.outputs.publish }}" = "true" ]; then
            git commit -m "veille: publication canonique groupée $(date -u +%F)"
          else
            git commit -m "veille: état de surveillance $(date -u +%F)"
          fi
          git push
