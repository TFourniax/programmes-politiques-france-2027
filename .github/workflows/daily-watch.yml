name: Daily political watch

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-watch.yml'
      - 'registries/watch.yaml'
      - 'registries/sources.yaml'
      - 'registries/parties.yaml'
      - 'registries/candidates.yaml'
      - 'scripts/daily_watch.py'
      - 'scripts/gdelt_watch.py'
      - 'scripts/social_watch.py'

permissions:
  contents: write

concurrency:
  group: daily-political-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Verify Gemini free inference
        if: github.event_name == 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          key = os.environ.get("GEMINI_API_KEY", "").strip()
          if not key:
              raise SystemExit("GEMINI_API_KEY is missing from GitHub Actions secrets")

          request = urllib.request.Request(
              "https://generativelanguage.googleapis.com/v1beta/interactions",
              data=json.dumps({
                  "model": "gemini-3.5-flash-lite",
                  "input": "Réponds uniquement par OK.",
                  "store": False,
              }).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": key,
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=45) as response:
                  if response.status != 200:
                      raise SystemExit(f"Gemini preflight failed: HTTP {response.status}")
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              try:
                  detail = json.loads(body).get("error", {}).get("message", "")
              except json.JSONDecodeError:
                  detail = body[:500]
              raise SystemExit(f"Gemini preflight failed: HTTP {exc.code}: {detail}")
          print("Gemini API key and free inference validated successfully.")
          PY

      - name: Run official web watch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/daily_watch.py --no-gdelt

      - name: Run batched GDELT press radar
        run: python scripts/gdelt_watch.py

      - name: Run official social watch
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/social_watch.py

      - name: Validate watch code
        run: pytest -q tests/test_daily_watch.py tests/test_gdelt_watch.py tests/test_social_watch.py

      - name: Commit watch inbox
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/veille
          if git diff --cached --quiet; then
            echo "No watch output changes to commit."
            exit 0
          fi
          git commit -m "veille: snapshot $(date -u +%F)"
          git push
