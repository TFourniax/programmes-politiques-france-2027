name: Daily political watch

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-watch.yml'
      - 'registries/watch.yaml'
      - 'registries/sources.yaml'
      - 'registries/parties.yaml'
      - 'registries/candidates.yaml'
      - 'scripts/daily_watch.py'
      - 'scripts/gdelt_watch.py'
      - 'scripts/social_watch.py'

permissions:
  contents: write

concurrency:
  group: daily-political-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Verify Gemini API key and Search Grounding
        if: github.event_name == 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import requests

          key = os.environ.get("GEMINI_API_KEY", "").strip()
          if not key:
              raise SystemExit("GEMINI_API_KEY is missing from GitHub Actions secrets")

          endpoint = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent"
          payload = {
              "contents": [{
                  "parts": [{
                      "text": "Utilise Google Search pour vérifier que le site officiel de l'Assemblée nationale française existe. Réponds très brièvement."
                  }]
              }],
              "tools": [{"google_search": {}}],
              "generationConfig": {"temperature": 0},
          }
          response = requests.post(
              endpoint,
              params={"key": key},
              json=payload,
              timeout=45,
          )
          if response.status_code >= 400:
              try:
                  detail = response.json().get("error", {}).get("message", "")
              except ValueError:
                  detail = response.text[:500]
              raise SystemExit(f"Gemini preflight failed: HTTP {response.status_code}: {detail}")

          data = response.json()
          candidates = data.get("candidates") or []
          if not candidates:
              raise SystemExit("Gemini preflight failed: API returned no candidate")
          metadata = candidates[0].get("groundingMetadata") or {}
          if not metadata:
              raise SystemExit("Gemini preflight failed: Google Search Grounding metadata missing")
          print("Gemini API key and Google Search Grounding validated successfully.")
          PY

      - name: Run official web and Google watch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/daily_watch.py --no-gdelt

      - name: Run batched GDELT press radar
        run: python scripts/gdelt_watch.py

      - name: Run official social watch
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/social_watch.py

      - name: Validate watch code
        run: pytest -q tests/test_daily_watch.py tests/test_gdelt_watch.py tests/test_social_watch.py

      - name: Commit watch inbox
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/veille
          if git diff --cached --quiet; then
            echo "No watch output changes to commit."
            exit 0
          fi
          git commit -m "veille: snapshot $(date -u +%F)"
          git push
