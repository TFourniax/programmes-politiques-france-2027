name: Gemini healthcheck

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gemini-healthcheck.yml'

permissions:
  contents: write

jobs:
  gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test Gemini API and Google Search Grounding
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          import urllib.error
          import urllib.parse
          import urllib.request

          key = os.environ.get("GEMINI_API_KEY", "").strip()
          if not key:
              raise SystemExit("GEMINI_API_KEY is missing")

          endpoint = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent"
          url = endpoint + "?" + urllib.parse.urlencode({"key": key})
          payload = json.dumps({
              "contents": [{"parts": [{"text": "Utilise Google Search pour vérifier l'existence du site officiel de l'Assemblée nationale française. Réponds en une phrase."}]}],
              "tools": [{"google_search": {}}],
              "generationConfig": {"temperature": 0}
          }).encode("utf-8")
          request = urllib.request.Request(
              url,
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=45) as response:
                  data = json.loads(response.read().decode("utf-8"))
                  status = response.status
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              try:
                  detail = json.loads(body).get("error", {}).get("message", body[:500])
              except json.JSONDecodeError:
                  detail = body[:500]
              raise SystemExit(f"Gemini API failed: HTTP {exc.code}: {detail}")

          candidates = data.get("candidates") or []
          if not candidates:
              raise SystemExit("Gemini API returned no candidate")
          grounding = candidates[0].get("groundingMetadata") or {}
          if not grounding:
              raise SystemExit("Google Search Grounding metadata missing")

          Path("research/veille").mkdir(parents=True, exist_ok=True)
          Path("research/veille/gemini-health.json").write_text(
              json.dumps({
                  "status": "ok",
                  "model": "gemini-2.5-flash-lite",
                  "google_search_grounding": True,
                  "http_status": status,
                  "checked_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              }, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("Gemini API + Google Search Grounding: OK")
          PY

      - name: Commit health status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/veille/gemini-health.json
          git commit -m "veille: Gemini healthcheck OK"
          git push
