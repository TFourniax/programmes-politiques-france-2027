name: Gemini healthcheck

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gemini-healthcheck.yml'

permissions:
  contents: write

jobs:
  gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Test Gemini free inference
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          import urllib.error
          import urllib.request

          model = "gemini-3.5-flash-lite"
          result = {
              "status": "error",
              "api_key_valid": False,
              "model": model,
              "api": "interactions",
              "free_inference": False,
              "google_search_grounding": "requires_billing_on_gemini_3_free_project",
              "checked_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              "source_commit": os.environ.get("GITHUB_SHA", ""),
          }

          key = os.environ.get("GEMINI_API_KEY", "").strip()
          if not key:
              result["error"] = "GEMINI_API_KEY is missing from GitHub Actions secrets"
          else:
              endpoint = "https://generativelanguage.googleapis.com/v1beta/interactions"
              payload = json.dumps({
                  "model": model,
                  "input": "Réponds uniquement par OK.",
                  "store": False
              }).encode("utf-8")
              request = urllib.request.Request(
                  endpoint,
                  data=payload,
                  headers={
                      "Content-Type": "application/json",
                      "x-goog-api-key": key,
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      response.read()
                      result["http_status"] = response.status
                  if response.status == 200:
                      result["status"] = "ok"
                      result["api_key_valid"] = True
                      result["free_inference"] = True
                  else:
                      result["error"] = "Unexpected Gemini response"
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  try:
                      detail = json.loads(body).get("error", {}).get("message", body[:500])
                  except json.JSONDecodeError:
                      detail = body[:500]
                  result["http_status"] = exc.code
                  result["error"] = f"Gemini API HTTP {exc.code}: {detail}"
                  if exc.code == 429:
                      result["status"] = "quota_exhausted"
              except Exception as exc:
                  result["error"] = f"Gemini request failed: {type(exc).__name__}: {exc}"

          Path("research/veille").mkdir(parents=True, exist_ok=True)
          Path("research/veille/gemini-health.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("Gemini healthcheck result:", result["status"])
          PY

      - name: Commit health status when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/veille/gemini-health.json
          if git diff --cached --quiet; then
            echo "Gemini health status unchanged."
            exit 0
          fi
          git commit -m "veille: Gemini healthcheck result"
          git push
