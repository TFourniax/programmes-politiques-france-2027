name: Gemini healthcheck

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gemini-healthcheck.yml'

permissions:
  contents: write

jobs:
  gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test Gemini API and Google Search Grounding
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          import urllib.error
          import urllib.request

          model = "gemini-3.5-flash-lite"
          result = {
              "status": "error",
              "model": model,
              "api": "interactions",
              "google_search_grounding": False,
              "checked_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              "source_commit": os.environ.get("GITHUB_SHA", ""),
          }

          key = os.environ.get("GEMINI_API_KEY", "").strip()
          if not key:
              result["error"] = "GEMINI_API_KEY is missing from GitHub Actions secrets"
          else:
              endpoint = "https://generativelanguage.googleapis.com/v1beta/interactions"
              payload = json.dumps({
                  "model": model,
                  "input": "Utilise Google Search pour vérifier l'existence du site officiel de l'Assemblée nationale française. Réponds en une phrase.",
                  "tools": [{"type": "google_search"}],
                  "store": False
              }).encode("utf-8")
              request = urllib.request.Request(
                  endpoint,
                  data=payload,
                  headers={
                      "Content-Type": "application/json",
                      "x-goog-api-key": key,
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      data = json.loads(response.read().decode("utf-8"))
                      result["http_status"] = response.status
                  serialized = json.dumps(data, ensure_ascii=False)
                  grounded = "google_search_call" in serialized or "google_search_result" in serialized
                  if grounded:
                      result["status"] = "ok"
                      result["google_search_grounding"] = True
                  else:
                      result["error"] = "Interaction succeeded but no Google Search execution was found in the response"
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  try:
                      detail = json.loads(body).get("error", {}).get("message", body[:500])
                  except json.JSONDecodeError:
                      detail = body[:500]
                  result["http_status"] = exc.code
                  result["error"] = f"Gemini API HTTP {exc.code}: {detail}"
              except Exception as exc:
                  result["error"] = f"Gemini request failed: {type(exc).__name__}: {exc}"

          Path("research/veille").mkdir(parents=True, exist_ok=True)
          Path("research/veille/gemini-health.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("Gemini healthcheck result:", result["status"])
          PY

      - name: Commit health status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/veille/gemini-health.json
          git commit -m "veille: Gemini healthcheck result"
          git push
