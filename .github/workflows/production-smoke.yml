name: Production public smoke

on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/production-smoke.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: production-public-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://politique2027.netlify.app' }}
    steps:
      - name: Exercise public health and deterministic answer
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          transient_http = {429, 500, 502, 503, 504}

          def request(path, payload=None, timeout=12, attempts=1):
              data = None
              headers = {
                  "accept": "application/json",
                  "user-agent": "politique2027-production-smoke/1.2",
              }
              method = "GET"
              if payload is not None:
                  data = json.dumps(payload, ensure_ascii=False).encode("utf-8")
                  headers["content-type"] = "application/json"
                  method = "POST"

              last_error = None
              for attempt in range(1, attempts + 1):
                  started = time.monotonic()
                  req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as response:
                          body = response.read().decode("utf-8")
                          elapsed = time.monotonic() - started
                          if response.status != 200:
                              raise RuntimeError(f"{path}: HTTP {response.status}")
                          return json.loads(body), elapsed, attempt
                  except urllib.error.HTTPError as exc:
                      last_error = exc
                      retryable = exc.code in transient_http
                      if not retryable or attempt == attempts:
                          raise
                  except (TimeoutError, urllib.error.URLError, OSError) as exc:
                      last_error = exc
                      if attempt == attempts:
                          raise

                  delay = min(2 * attempt, 5)
                  print(
                      f"Transient production probe failure on {path} "
                      f"(attempt {attempt}/{attempts}): {last_error}; retrying in {delay}s",
                      file=sys.stderr,
                  )
                  time.sleep(delay)

              raise RuntimeError(f"{path}: exhausted retries: {last_error}")

          def assert_known_answer(answer):
              assert answer.get("generated") is False, answer
              assert answer.get("answer", {}).get("cards"), answer
              assert answer.get("citations"), answer
              assert any(
                  citation.get("path") == "proposals/services-publics/ps-abrogation-parcoursup.md"
                  for citation in answer["citations"]
              ), answer

          # Each serverless route can have an independent cold start. We therefore
          # verify availability/contract on the first call and apply latency SLOs to
          # an immediate second call to the same route.
          health, cold_health_s, health_attempt = request("/api/health", timeout=20, attempts=3)
          assert health.get("ok") is True, health
          chat = health.get("chat") or {}
          assert chat.get("engine") == "deterministic-bm25-ontology-v4", chat
          assert chat.get("responseGeneration") == "deterministic_extractive", chat

          warm_health, health_s, warm_health_attempt = request("/api/health", timeout=8, attempts=2)
          assert warm_health.get("ok") is True, warm_health
          warm_chat = warm_health.get("chat") or {}
          assert warm_chat.get("engine") == "deterministic-bm25-ontology-v4", warm_chat
          assert warm_chat.get("responseGeneration") == "deterministic_extractive", warm_chat

          chat_payload = {
              "question": "Quel projet propose d'abroger Parcoursup ?",
              "history": [],
              "sessionContext": {},
          }
          cold_answer, cold_answer_s, cold_answer_attempt = request(
              "/api/chat",
              chat_payload,
              timeout=20,
              attempts=2,
          )
          assert_known_answer(cold_answer)

          answer, answer_s, answer_attempt = request(
              "/api/chat",
              chat_payload,
              timeout=12,
              attempts=2,
          )
          assert_known_answer(answer)

          assert health_s < 5.0, f"warm health latency too high: {health_s:.3f}s"
          assert answer_s < 8.0, f"warm chat latency too high: {answer_s:.3f}s"

          if health_attempt > 1 or cold_health_s >= 5.0:
              print(
                  f"::warning::Production health cold start/transient observed: "
                  f"attempt={health_attempt}, first_success={cold_health_s:.3f}s"
              )
          if cold_answer_attempt > 1 or cold_answer_s >= 8.0:
              print(
                  f"::warning::Production chat cold start/transient observed: "
                  f"attempt={cold_answer_attempt}, first_success={cold_answer_s:.3f}s"
              )
          if warm_health_attempt > 1:
              print(f"::warning::Warm health required retry attempt {warm_health_attempt}")
          if answer_attempt > 1:
              print(f"::warning::Warm chat required retry attempt {answer_attempt}")

          print(json.dumps({
              "base": base,
              "cold_health_seconds": round(cold_health_s, 3),
              "cold_health_attempt": health_attempt,
              "warm_health_seconds": round(health_s, 3),
              "warm_health_attempt": warm_health_attempt,
              "cold_chat_seconds": round(cold_answer_s, 3),
              "cold_chat_attempt": cold_answer_attempt,
              "warm_chat_seconds": round(answer_s, 3),
              "warm_chat_attempt": answer_attempt,
              "commitRef": warm_health.get("deployment", {}).get("commitRef"),
              "watchStatus": warm_health.get("watch", {}).get("status"),
              "result": "ok",
          }, ensure_ascii=False))
          PY

      - name: Open or refresh production incident
        if: always() && steps.smoke.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: '[AUTO] Production publique dégradée'
        shell: bash
        run: |
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          body="Le smoke synthétique de la production publique a échoué après retries bornés, ou le contrat /api/health / réponse déterministe n'est plus conforme, ou la latence chaude dépasse le SLO. Les cold starts transitoires sont mesurés séparément et ne suffisent pas à déclarer un incident. Aucun changement de donnée n'est effectué automatiquement par ce workflow."
          if [ -z "$issue" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
          else
            gh issue comment --repo "$GITHUB_REPOSITORY" "$issue" --body "Nouvel échec du smoke production à $(date -u +%FT%TZ)."
          fi

      - name: Close recovered production incident
        if: always() && steps.smoke.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: '[AUTO] Production publique dégradée'
        shell: bash
        run: |
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue close --repo "$GITHUB_REPOSITORY" "$issue" --comment "Production de nouveau conforme au smoke test à $(date -u +%FT%TZ)."
          fi

      - name: Fail visibly after incident bookkeeping
        if: always() && steps.smoke.outcome == 'failure'
        run: exit 1
