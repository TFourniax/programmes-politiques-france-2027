name: Research quality gate

on:
  pull_request:
    paths:
      - 'corpus/**'
      - 'proposals/**'
      - 'registries/**'
      - 'data/**'
      - 'schemas/**'
      - 'research/quality-targets.json'
      - 'scripts/build_coverage_report.py'
      - 'scripts/build_evidence_graph.py'
      - 'scripts/check_research_quality.py'
      - 'tests/test_research_quality.py'
      - 'METHODOLOGY.md'
      - 'SOURCES_POLICY.md'
      - 'GOVERNANCE.md'
      - 'CORRECTIONS_POLICY.md'
      - 'CONFLICTS_OF_INTEREST.md'
      - 'DATA_DICTIONARY.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/validate.py
      - run: python scripts/check_research_quality.py
      - run: python scripts/build_evidence_graph.py --output /tmp/evidence-graph.json
      - run: pytest -q tests/test_research_quality.py
