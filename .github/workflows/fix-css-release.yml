name: Fix V1 CSS warnings

on:
  push:
    branches: [cleanup/v1-css-warnings]
    paths:
      - '.github/workflows/fix-css-release.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cleanup/v1-css-warnings
      - name: Replace unsupported flex alignment aliases
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/explorer.css')
          text = path.read_text(encoding='utf-8')
          old_a = '.explorerEvidenceTop{display:flex;justify-content:space-between;gap:12px;align-items:start}'
          new_a = '.explorerEvidenceTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}'
          old_b = '.coverageTopicTop{display:flex;align-items:start;justify-content:space-between;gap:10px}'
          new_b = '.coverageTopicTop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}'
          if text.count(old_a) != 1 or text.count(old_b) != 1:
              raise SystemExit('Expected CSS declarations were not found exactly once')
          text = text.replace(old_a, new_a).replace(old_b, new_b)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit CSS cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/explorer.css
          git commit -m 'style: supprime les warnings Autoprefixer de la V1'
          git push origin HEAD:cleanup/v1-css-warnings
