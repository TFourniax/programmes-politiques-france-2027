name: Validate corpus

on:
  push:
    branches: [main]
    paths:
      - 'corpus/**'
      - 'proposals/**'
      - 'data/entities.json'
      - 'registries/candidates.yaml'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'corpus/**'
      - 'proposals/**'
      - 'data/entities.json'
      - 'registries/candidates.yaml'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/validate.py
      - run: pytest -q
