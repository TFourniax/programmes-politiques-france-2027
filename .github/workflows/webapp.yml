name: Validate web app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python QA dependencies
        run: pip install -r requirements.txt
      - name: Install web dependencies
        run: npm install
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Validate political data
        run: npm run validate:data
      - name: Retrieval and product QA
        run: npm run test:retrieval
      - name: Build application
        env:
          LLM_API_KEY: build-only-placeholder
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance tests
        env:
          CI: 'true'
        run: npm run test:e2e
