name: Validate web app

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'data/entities.json'
      - 'data/compass.json'
      - 'corpus/**'
      - 'proposals/**'
      - 'netlify/**'
      - 'netlify.toml'
      - 'next.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-search-index.mjs'
      - 'scripts/test-*.mjs'
      - 'tests/e2e/**'
      - '.github/workflows/webapp.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python QA dependencies
        run: pip install -r requirements.txt
      - name: Install web dependencies
        run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Validate political data
        run: npm run validate:data
      - name: Retrieval and product QA
        run: npm run test:retrieval
      - name: Build application
        env:
          LLM_API_KEY: build-only-placeholder
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance — homepage modes
        env:
          CI: 'true'
        run: npx playwright test --grep "homepage exposes"
      - name: Browser acceptance — explorer and history UI
        env:
          CI: 'true'
        run: npx playwright test --grep "personality, comparison"
      - name: Browser acceptance — dense mobile layouts
        env:
          CI: 'true'
        run: npx playwright test --grep "dense public views remain"
      - name: Browser acceptance — health API
        env:
          CI: 'true'
        run: npx playwright test --grep "health endpoint"
      - name: Browser acceptance — history API
        env:
          CI: 'true'
        run: npx playwright test --grep "history API"
      - name: Browser acceptance — chat safety and conversation
        env:
          CI: 'true'
        run: npx playwright test --grep "chat endpoint preserves"
      - name: Browser acceptance — sustained human usage and abuse cap
        env:
          CI: 'true'
        run: npx playwright test --grep "server rate limit allows"
      - name: Browser acceptance — per-answer source binding
        env:
          CI: 'true'
        run: npx playwright test --grep "each visible answer keeps"
